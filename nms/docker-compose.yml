services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=nms
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # API Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server
    restart: unless-stopped
    environment:
      - MONGO_CONNECTION_URI=mongodb://root:password@db:27017/
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./:/app

volumes:
  mongodb_data:

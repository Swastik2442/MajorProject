[project]
name = "nms"
version = "0.4.1"
description = "API Service to store NMS Alerts"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dependencies = [
    "common[auth,db]",
    "fastapi[standard]>=0.121.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
]

[tool.uv.sources]
common = { path = "../common" }

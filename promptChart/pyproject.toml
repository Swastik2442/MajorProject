[project]
name = "promptchart"
version = "0.2.0"
description = "LangChain-based application to generate charts based on user prompts"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dependencies = [
    "common[caching]",
    "fastapi[standard]>=0.121.0",
    "langchain>=1.0.3",
    "langchain-openai>=1.0.2",
    "langgraph-checkpoint-postgres>=3.0.1",
    "langgraph-cli>=0.4.7",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.11.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.7",
]

[tool.uv.sources]
common = { path = "../common" }

[project]
name = "promptchart"
version = "0.1.0"
description = "LangChain-based application to generate charts based on user prompts"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dependencies = [
    "langchain>=1.0.3",
    "langchain-openai>=1.0.2",
    "pydantic>=2.12.4",
]
